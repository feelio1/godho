# 펫클 iOS — Codemagic으로 맥 없이 TestFlight까지 (iOS 출시 준비 L-8)
#
# 이 파일에는 비밀값이 하나도 없다. 값은 Codemagic 웹의 환경 변수 그룹
# `petcli_ios`(전부 Secure로)와 팀 연동(App Store Connect API 키)에 넣는다.
# 변수 이름·만드는 법·처음 한 번 할 일은 tool/ios/README.md.
#
# 빌드는 Codemagic 화면에서 직접 시작할 때만 돈다(푸시마다 자동으로 돌지 않음).
# 결과는 TestFlight에만 올린다 — App Store 심사 제출은 구르미가 직접 한다.
workflows:
  ios-testflight:
    name: iOS TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      # Codemagic > Team settings > Integrations > Developer Portal에 등록한
      # App Store Connect API 키의 이름(비밀값 아님). 서명 파일 받기와
      # TestFlight 업로드에 함께 쓴다.
      app_store_connect: petcli_asc
    environment:
      groups:
        - petcli_ios
      # 저장소 개발 환경과 같은 Flutter 버전으로 고정한다.
      flutter: 3.47.8
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.petcheck.petcliniccheck
    scripts:
      - name: 비밀 파일 만들기 (GoogleService-Info.plist, Secrets.xcconfig, dart-define)
        script: |
          #!/bin/bash
          # 값은 절대 출력하지 않는다 — "있음/없음"만 남긴다. set -x 금지.
          set -euo pipefail

          # 1) Firebase iOS 설정 파일(base64) → ios/Runner/GoogleService-Info.plist
          #    (저장소에는 커밋하지 않는 파일 — .gitignore). 빌드 단계가 있을 때만 앱에 넣는다.
          if [ -n "${GOOGLE_SERVICE_INFO_PLIST:-}" ]; then
            printf '%s' "$GOOGLE_SERVICE_INFO_PLIST" | base64 --decode > ios/Runner/GoogleService-Info.plist
            plutil -lint ios/Runner/GoogleService-Info.plist > /dev/null
            echo "GoogleService-Info.plist: 만듦"
          else
            echo "경고: GOOGLE_SERVICE_INFO_PLIST 없음 — Firebase 없이 빌드(로그인·일기 등은 동작 안 함)"
          fi

          # 2) Info.plist의 $(…) 값 → ios/Flutter/Secrets.xcconfig (커밋 안 함).
          #    값이 있는 줄만 쓴다 — 빈 값으로 덮으면 Debug/Release.xcconfig의 기본값이 사라진다.
          SECRETS=ios/Flutter/Secrets.xcconfig
          : > "$SECRETS"
          for key in ADMOB_APP_ID_IOS GOOGLE_IOS_CLIENT_ID GOOGLE_REVERSED_CLIENT_ID; do
            value="${!key:-}"
            if [ -n "$value" ]; then
              printf '%s = %s\n' "$key" "$value" >> "$SECRETS"
              echo "$key: 설정"
            else
              echo "$key: 없음 — 기본값 사용"
            fi
          done

          # 3) dart-define 값(JSON) → 저장소·build 폴더 밖 임시 파일. 없으면 빈 JSON
          #    (지도는 "준비 중", 광고는 구글 공개 테스트 ID로 안전하게 대체된다).
          DART_DEFINES_FILE="$HOME/petcli_dart_defines.json"
          if [ -n "${DART_DEFINES_JSON:-}" ]; then
            printf '%s' "$DART_DEFINES_JSON" > "$DART_DEFINES_FILE"
          else
            echo "경고: DART_DEFINES_JSON 없음 — 빈 값으로 빌드"
            printf '{}' > "$DART_DEFINES_FILE"
          fi
          python3 -c 'import json, sys; d = json.load(open(sys.argv[1])); assert isinstance(d, dict); print("dart-define 키 %d개" % len(d))' "$DART_DEFINES_FILE"
          echo "DART_DEFINES_FILE=$DART_DEFINES_FILE" >> "$CM_ENV"

      - name: Flutter 패키지 받기
        script: flutter pub get

      - name: 서명 프로필 적용
        script: xcode-project use-profiles

      - name: IPA 빌드 (빌드 번호는 pubspec의 +N)
        script: |
          #!/bin/bash
          set -euo pipefail
          flutter build ipa --release \
            --dart-define-from-file="$DART_DEFINES_FILE" \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
